name: ci

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      commit_id: ${{ env.COMMIT_ID }}
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set short git commit SHA
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: andyburgin/python-app:${{ env.COMMIT_ID }}
  cd:
    runs-on: self-hosted
    needs: ci
    steps:
      -
        name: checkout repo
        uses: actions/checkout@v3
      -
        name: Modify Values file
        shell: bash
        run: |
          echo ${{ needs.ci.outputs.commit_id }}
          curl -skSL -o /tmp/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod a+x /tmp/yq
          /tmp/yq -i '.image.tag = "${{ needs.ci.outputs.commit_id }}"' charts/python-app/values.yaml  
      -
        name: Commit Changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "update values.yaml with commit ${{ needs.ci.outputs.commit_id }}"
      -
        name: install argocd cli
        shell: bash
        run: |
          curl -skSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64
          chmod a+x argocd
          sudo mv ./argocd /usr/local/bin/argocd
      -
        name: Argocd app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd --insecure --grpc-web --username ${{ vars.ARGOCD_USERNAME }} --password ${{ secrets.ARGOCD_PASSWORD}}
          argocd app sync python-app

